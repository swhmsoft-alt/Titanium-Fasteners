name: Deploy to cPanel via FTP (audit-gated)

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job only reads the repository. `statuses: write` is the one extra
# permission: it lets the job publish the deployment outcome as a commit
# status, which is readable without a GitHub session.
permissions:
  contents: read
  statuses: write

# Two pushes must never write the same FTP directory at the same time.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Full upload duration is bounded so a stuck transfer cannot occupy a runner.
timeout-minutes: 60

jobs:
  build-and-deploy:
    name: Build, gate, deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: npm` on purpose — a poisoned cache keeps polluting the
          # environment long after the offending commit is gone.

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Product data gate: CSV truth source → generated src/data/products.
      - name: Generate product data
        run: npm run gen:products

      # npm run build routes through scripts/astro-build.mjs, which
      # canonicalises the project root before spawning Astro (Windows CSS
      # fix). On Linux the path is already canonical — a no-op there.
      - name: Build
        run: npm run build

      # ── GATE ───────────────────────────────────────────────────────────────
      # Reads the BUILD OUTPUT (dist/), not the source tree: the artefact is
      # the single source of truth. Runs AFTER the build because it needs
      # dist/ to exist. A non-zero exit aborts the job — no continue-on-error,
      # no --no-verify: a broken build must never reach the server.
      - name: Gate — internal link integrity
        run: node scripts/check-links.mjs --report _audit/link-report.txt

      # The report is uploaded even when the gate fails, so the failure is
      # diagnosable after the fact.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-audit-report
          path: _audit/
          if-no-files-found: ignore
          retention-days: 14

      # ── DEPLOY ─────────────────────────────────────────────────────────────
      # Credentials live in repository Secrets — never in this file.
      #
      # Every value has a fallback chain, because an unset secret must degrade
      # to the next source instead of aborting the whole run:
      #   host     -> secret -> repository variable -> the known cPanel host
      #   user     -> secret FTP_USER -> FTP_USERNAME -> FTP2_USERNAME
      #   password -> secret FTP_PASSWORD -> FTP2_PASSWORD
      #   path     -> secret FTP_REMOTE_PATH -> secret FTP_DIR (legacy)
      #   port     -> secret FTP_PORT -> 21
      - name: Deploy to cPanel over FTPS
        id: deploy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || vars.FTP_HOST || 'fastener.bozemetal.com' }}
          FTP_USER: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || secrets.FTP2_USERNAME }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP2_USERNAME: ${{ secrets.FTP2_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.FTP2_PASSWORD }}
          FTP2_PASSWORD: ${{ secrets.FTP2_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH || secrets.FTP_DIR }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
        run: |
          set -o pipefail
          mkdir -p _audit
          node scripts/deploy-ftp-ci.mjs 2>&1 | tee _audit/deploy-log.txt

      # The deployment log is uploaded whatever happened, so a failed transfer
      # can be read after the fact.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-log
          path: _audit/deploy-log.txt
          if-no-files-found: ignore
          retention-days: 14

      # A commit status carries a one-line summary of the deployment. Unlike
      # the run log it is readable without a GitHub session, so a broken
      # pipeline stays diagnosable from the outside.
      - name: Report deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -uo pipefail
          mkdir -p _audit
          {
            echo "### Deployment"
            echo
            echo "- outcome: \`${DEPLOY_OUTCOME}\`"
            if [ -f _audit/deploy-log.txt ]; then
              echo
              echo '```'
              tail -n 40 _audit/deploy-log.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          SUMMARY=$(tail -n 12 _audit/deploy-log.txt 2>/dev/null | tr '\n' ' ' | cut -c1-200)
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$([ "${DEPLOY_OUTCOME}" = success ] && echo success || echo failure)" \
            -f context="deploy/ftps" \
            -f description="${SUMMARY:-deployment did not run}" \
            --silent || echo "::warning::could not publish the deployment status"
