name: Deploy to cPanel via FTP (audit-gated)

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job only needs to read the repository. Nothing is written back.
permissions:
  contents: read

# Two pushes must never write the same FTP directory at the same time.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Full upload duration is bounded so a stuck transfer cannot occupy a runner.
timeout-minutes: 60

jobs:
  build-and-deploy:
    name: Build, gate, deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: npm` on purpose — a poisoned cache keeps polluting the
          # environment long after the offending commit is gone.

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Product data gate: CSV truth source → generated src/data/products.
      - name: Generate product data
        run: npm run gen:products

      # npm run build routes through scripts/astro-build.mjs, which
      # canonicalises the project root before spawning Astro (Windows CSS
      # fix). On Linux the path is already canonical — a no-op there.
      - name: Build
        run: npm run build

      # ── GATE ───────────────────────────────────────────────────────────────
      # Reads the BUILD OUTPUT (dist/), not the source tree: the artefact is
      # the single source of truth. Runs AFTER the build because it needs
      # dist/ to exist. A non-zero exit aborts the job — no continue-on-error,
      # no --no-verify: a broken build must never reach the server.
      - name: Gate — internal link integrity
        run: node scripts/check-links.mjs --report _audit/link-report.txt

      # The report is uploaded even when the gate fails, so the failure is
      # diagnosable after the fact.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-audit-report
          path: _audit/
          if-no-files-found: ignore
          retention-days: 14

      # ── DEPLOY ─────────────────────────────────────────────────────────────
      # Credentials live in repository Secrets — never in this file.
      #
      # Every value has a fallback chain, because an unset secret must degrade
      # to the next source instead of aborting the whole run:
      #   host     -> secret -> repository variable -> the known cPanel host
      #   user     -> secret FTP_USER -> secret FTP_USERNAME (legacy)
      #   password -> secret FTP_PASSWORD -> secret FTP2_PASSWORD (probe set)
      #   path     -> secret FTP_REMOTE_PATH -> secret FTP_DIR (legacy)
      #   port     -> secret FTP_PORT -> 21
      - name: Deploy to cPanel over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || vars.FTP_HOST || 'fastener.bozemetal.com' }}
          FTP_USER: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || secrets.FTP2_USERNAME }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP2_USERNAME: ${{ secrets.FTP2_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.FTP2_PASSWORD }}
          FTP2_PASSWORD: ${{ secrets.FTP2_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH || secrets.FTP_DIR }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
        run: node scripts/deploy-ftp-ci.mjs
