name: Deploy to cPanel via FTP (audit-gated)

on:
  push:
    branches: [main]
  workflow_dispatch:

# The job reads the repository and publishes its own diagnostics:
#   statuses: write -> the deployment outcome as a commit status
#   contents: write -> the deployment log on the `deploy-diagnostics` branch
# Neither permission can touch the source code on `main`.
permissions:
  contents: write
  statuses: write

# Two pushes must never write the same FTP directory at the same time.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, gate, deploy
    runs-on: ubuntu-latest
    # Full upload duration is bounded so a stuck transfer cannot occupy a
    # runner. `timeout-minutes` belongs to the JOB, not to the workflow.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: npm` on purpose — a poisoned cache keeps polluting the
          # environment long after the offending commit is gone.

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Product data gate: CSV truth source → generated src/data/products.
      - name: Generate product data
        run: npm run gen:products

      # npm run build routes through scripts/astro-build.mjs, which
      # canonicalises the project root before spawning Astro (Windows CSS
      # fix). On Linux the path is already canonical — a no-op there.
      - name: Build
        run: npm run build

      # ── GATE ───────────────────────────────────────────────────────────────
      # Reads the BUILD OUTPUT (dist/), not the source tree: the artefact is
      # the single source of truth. Runs AFTER the build because it needs
      # dist/ to exist. A non-zero exit aborts the job — no continue-on-error,
      # no --no-verify: a broken build must never reach the server.
      - name: Gate — internal link integrity
        run: node scripts/check-links.mjs --report _audit/link-report.txt

      # The 404 page is the only承接点 for a URL that does not exist, and
      # the dev server cannot be trusted to prove it (Astro's trailing-slash
      # middleware answers slash-less URLs with its own template before the
      # routing pipeline runs). This gate reproduces the production
      # `ErrorDocument 404 /404.html` semantics locally and asserts that
      # every unknown URL shape renders our page with a 404 status.
      - name: Gate — 404 page acceptance
        run: node scripts/check-404.mjs

      # AI 搜索选源资格闸门（六维评分）：读 dist/，按《工业 B2B 商业页面 AI
      # 搜索选源资格检查标准》打分。只要有页面在「索引资格」或「事实与证据」
      # 两个硬门槛上失败就 exit 1 —— 品牌残留或 canonical 错误不允许被其它
      # 维度的高分掩盖。报告落 _audit/ 供事后诊断。
      - name: Gate — AI source qualification
        run: node scripts/check-ai-source.mjs

      # The report is uploaded even when the gate fails, so the failure is
      # diagnosable after the fact.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-audit-report
          path: _audit/
          if-no-files-found: ignore
          retention-days: 14

      # ── DEPLOY ─────────────────────────────────────────────────────────────
      # Credentials live in repository Secrets — never in this file.
      #
      # Every variable keeps its own name on purpose. The deployer pairs a
      # user with the password of the SAME set, because a user from one set
      # and a password from another can only fail:
      #   set 1 -> FTP_USERNAME  + FTP_PASSWORD
      #   set 2 -> FTP2_USERNAME + FTP2_PASSWORD
      # The sets are tried in order; an account whose home directory does not
      # exist is rejected by the server and the next set takes over. The
      # deployer also accepts the FTP_USER spelling, but this repository does
      # not carry that secret, so it is not wired here.
      #
      # ONLY names that are actually configured in this repository are
      # referenced below. The Actions expression validator resolves every
      # `secrets.X` / `vars.X` against the repository's configured names and
      # reports an access to an unknown name as an invalid context access,
      # so referencing a name that does not exist keeps the workflow
      # permanently red — even though the runtime would merely expand it to
      # an empty string.
      #
      # The host falls back to the known cPanel host, the port to 21.
      - name: Deploy to cPanel over FTPS
        id: deploy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP2_USERNAME: ${{ secrets.FTP2_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP2_PASSWORD: ${{ secrets.FTP2_PASSWORD }}
          # FTP_DIR is the spelling the repository actually carries; the
          # deployer prefers FTP_REMOTE_PATH and falls back to FTP_DIR.
          FTP_REMOTE_PATH: ${{ secrets.FTP_DIR }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          # TLS server-name pinning is deliberately NOT wired here: the
          # repository has no FTP_TLS_SERVERNAME secret, and referencing a
          # name that does not exist is reported as an invalid context
          # access. The deployer already resolves this on its own — it reads
          # the server certificate once and uses a name the certificate DOES
          # cover, so the handshake stays fully verified. To pin a name
          # explicitly, create the `FTP_TLS_SERVERNAME` secret (and, to
          # forbid the automatic fallback, the `FTP_TLS_STRICT` repository
          # variable set to `true`) and add the two env lines back here.
        run: |
          set -o pipefail
          mkdir -p _audit
          # Host fallback: repository secret -> the known cPanel host. An
          # unset secret expands to an empty string, so `${VAR:-fallback}`
          # covers both "unset" and "empty".
          FTP_HOST="${FTP_HOST:-fastener.bozemetal.com}"
          export FTP_HOST
          node scripts/deploy-ftp-ci.mjs 2>&1 | tee _audit/deploy-log.txt

      # The deployment log is uploaded whatever happened, so a failed transfer
      # can be read after the fact.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-log
          path: _audit/deploy-log.txt
          if-no-files-found: ignore
          retention-days: 14

      # A commit status carries a one-line summary of the deployment. Unlike
      # the run log it is readable without a GitHub session, so a broken
      # pipeline stays diagnosable from the outside.
      - name: Report deployment result
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -uo pipefail
          mkdir -p _audit
          {
            echo "### Deployment"
            echo
            echo "- outcome: \`${DEPLOY_OUTCOME}\`"
            if [ -f _audit/deploy-log.txt ]; then
              echo
              echo '```'
              tail -n 40 _audit/deploy-log.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          SUMMARY=$(tail -n 12 _audit/deploy-log.txt 2>/dev/null | tr '\n' ' ' | tr -d '"\\' | cut -c1-200)
          STATE=$([ "${DEPLOY_OUTCOME}" = success ] && echo success || echo failure)
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"deploy/ftps\",\"description\":\"${SUMMARY:-deployment did not run}\"}" \
            -o /dev/null -w 'status-api:%{http_code}\n' || echo "::warning::could not publish the deployment status"

          # The same log is committed to a dedicated branch. A branch can be
          # read with a plain `git fetch`, so the failure stays diagnosable
          # even when the run log and the API are behind a login. The file name
          # carries the commit sha, so every run adds a new entry.
          if [ -f _audit/deploy-log.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B deploy-diagnostics
            mkdir -p deploy-logs
            cp _audit/deploy-log.txt "deploy-logs/${GITHUB_SHA}.txt"
            cp _audit/deploy-log.txt deploy-log.txt
            git add -f deploy-log.txt "deploy-logs/${GITHUB_SHA}.txt"
            git commit -q -m "deploy log for ${GITHUB_SHA}" || true
            git push --force origin deploy-diagnostics \
              || echo "::warning::could not push the diagnostics branch"
          fi
