name: Deploy channel probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe channels
        env:
          HOST: fastener.bozemetal.com
          FTP_PORT: '21'
          U1: ${{ secrets.FTP_USERNAME }}
          P1: ${{ secrets.FTP_PASSWORD }}
          U2: ${{ secrets.FTP2_USERNAME }}
          P2: ${{ secrets.FTP2_PASSWORD }}
        run: |
          set -uo pipefail
          echo "== TCP reachability =="
          for p in 21 22 443 2083; do
            if timeout 10 bash -c "</dev/tcp/$HOST/$p" 2>/dev/null; then
              echo "PORT $p OPEN"
            else
              echo "PORT $p closed/filtered"
            fi
          done

          echo "== directory layout =="
          python3 - <<'PY'
          import ftplib, os
          HOST = os.environ["HOST"]
          PORT = int(os.environ["FTP_PORT"])
          user = os.environ.get("U2", "")
          pw = os.environ.get("P2", "")
          f = ftplib.FTP_TLS(timeout=30)
          f.connect(HOST, PORT)
          f.login(user, pw)
          try:
              f.prot_p()
          except ftplib.error_perm:
              pass
          print("PWD:", f.pwd())
          for d in ["fastener.bozemetal.com", "cnc.bozemetal.com", "bozemetal.com"]:
              try:
                  f.cwd(d)
                  print("--- %s ---" % d)
                  f.retrlines("LIST")
              except Exception as exc:
                  print("--- %s -> %s" % (d, exc))
          f.quit()
          PY
