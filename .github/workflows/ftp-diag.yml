name: FTP diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe FTP accounts
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP2_USERNAME: ${{ secrets.FTP2_USERNAME }}
          FTP2_PASSWORD: ${{ secrets.FTP2_PASSWORD }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import ftplib, os, socket

          PORT = int(os.environ.get("FTP_PORT", "21"))
          NEW = (os.environ.get("FTP_USERNAME", ""), os.environ.get("FTP_PASSWORD", ""))
          OLD = (os.environ.get("FTP2_USERNAME", ""), os.environ.get("FTP2_PASSWORD", ""))
          HOSTS = ["fastener.bozemetal.com", "ftp.safetiparts.com", "safetiparts.com"]
          USERS = ["fastener@fastener.bozemetal.com", "fastener", "safetipa"]
          PASSWORDS = [("new", NEW[1]), ("old", OLD[1])]

          for host in HOSTS:
              for user in USERS:
                  for label, pw in PASSWORDS:
                      if not pw:
                          continue
                      tag = "%s | %s | %s" % (host, user, label)
                      try:
                          ftp = ftplib.FTP_TLS(timeout=25)
                          ftp.connect(host, PORT)
                          ftp.login(user, pw)
                          try:
                              ftp.prot_p()
                          except ftplib.error_perm:
                              pass
                          print("OK   %s -> pwd=%s" % (tag, ftp.pwd()))
                          ftp.quit()
                      except ftplib.error_perm as exc:
                          print("FAIL %s -> %s" % (tag, exc))
                      except Exception as exc:
                          print("ERR  %s -> %s: %s" % (tag, type(exc).__name__, exc))
                      socket.setdefaulttimeout(None)
          PY
