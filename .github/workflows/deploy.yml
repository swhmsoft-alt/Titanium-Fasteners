name: Deploy to cPanel (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job only needs to read the repository. Nothing is written back.
permissions:
  contents: read

# Never let two deploys race for the same FTP directory.
concurrency:
  group: cpanel-ftp-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build and upload to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Product data gate: CSV truth source → generated src/data/products.
      # Exits non-zero on any error, so a broken dataset can never be published.
      - name: Generate product data
        run: npm run gen:products

      # Base path (Astro bakes it into every asset URL at build time).
      # The FTP target IS the domain root (/home/safetipa/fastener.bozemetal.com),
      # so the default is NO prefix. Override with the BASE_PATH repository
      # variable if the site is ever published under a sub-directory.
      - name: Resolve base path
        run: |
          if [ -n "${{ vars.BASE_PATH }}" ]; then
            echo "BASE_PATH=${{ vars.BASE_PATH }}" >> "$GITHUB_ENV"
            echo "Using explicit BASE_PATH=${{ vars.BASE_PATH }}"
          else
            echo "BASE_PATH=" >> "$GITHUB_ENV"
            echo "Serving from the domain root (FTP target is the docroot)"
          fi

      # npm run build routes through scripts/astro-build.mjs, which canonicalises
      # the project root before spawning Astro. On Linux the path is already
      # canonical, so this is a no-op there — but it keeps the Windows build
      # (which needs the fix) and the CI build on the same launcher.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ env.BASE_PATH }}

      # Explicit FTPS (FTPES / AUTH TLS) on the standard control port 21.
      #
      # The upload runs through Python's ftplib (stdlib, preinstalled on the
      # runner) instead of lftp, because cPanel subdomain accounts log in as
      # "user@domain" — a form lftp re-parses as a host qualifier, while
      # ftplib passes the login string to the server verbatim.
      #
      # ftplib.FTP_TLS performs:
      #   • AUTH TLS on the control connection (explicit FTPS, not implicit),
      #   • PROT P, so the data channel is encrypted too.
      #
      # The account is chrooted into the subdomain document root, so the local
      # dist/ tree is mirrored onto the FTP root itself.
      #
      # Credentials live in repository secrets — never in the workflow file.
      - name: Upload to cPanel over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          SYNC_DELETE: ${{ vars.SYNC_DELETE }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_PORT FTP_DIR; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret: $v"
              exit 1
            fi
          done

          # Server-side deletion stays opt-in: the docroot may hold files that
          # this repository does not own (.well-known, mail/verifier files).
          if [ "${SYNC_DELETE:-false}" = "true" ]; then
            echo "sync-delete enabled"
          else
            echo "sync-delete disabled (set repository variable SYNC_DELETE=true to enable)"
          fi

          python3 - <<'PY'
          import ftplib, os, posixpath, sys
          from ftplib import FTP_TLS

          HOST = os.environ["FTP_HOST"]
          USER = os.environ["FTP_USERNAME"]
          PASSWORD = os.environ["FTP_PASSWORD"]
          PORT = int(os.environ["FTP_PORT"])
          ROOT = os.environ.get("FTP_DIR", ".").strip() or "."
          DELETE = os.environ.get("SYNC_DELETE", "false").strip().lower() == "true"
          LOCAL = os.path.join(os.environ["GITHUB_WORKSPACE"], "dist")

          ftp = FTP_TLS(timeout=60)
          ftp.connect(HOST, PORT)
          ftp.login(USER, PASSWORD)
          try:
              ftp.prot_p()          # encrypted data channel
          except ftplib.error_perm:
              print("::warning::Server refused PROT P; continuing with the control channel only")
          print("Connected to %s:%d as %s (explicit FTPS)" % (HOST, PORT, USER))
          print("Remote PWD:", ftp.pwd())

          def remote_join(*parts):
              return posixpath.join(ROOT, *parts) if ROOT not in ("", ".") else posixpath.join(*parts)

          def ensure_dir(path):
              if path in ("", "/", "."):
                  return
              parts = path.strip("/").split("/")
              cur = ""
              for p in parts:
                  cur = cur + "/" + p
                  try:
                      ftp.mkd(cur)
                  except ftplib.error_perm:
                      pass  # already exists

          def walk_remote(path):
              """Return the set of relative file paths under the remote root."""
              found = set()
              stack = [""]
              while stack:
                  rel = stack.pop()
                  try:
                      ftp.cwd(remote_join(rel) if rel else ROOT)
                  except ftplib.error_perm:
                      continue
                  items = []
                  ftp.retrlines("LIST", items.append)
                  for line in items:
                      name = line.split()[-1]
                      if name in (".", ".."):
                          continue
                      child = posixpath.join(rel, name) if rel else name
                      if line.startswith("d"):
                          stack.append(child)
                      else:
                          found.add(child)
              return found

          # 1) Upload every local file.
          uploaded = 0
          local_files = set()
          for dirpath, _dirs, files in os.walk(LOCAL):
              for name in files:
                  full = os.path.join(dirpath, name)
                  rel = os.path.relpath(full, LOCAL).replace(os.sep, "/")
                  local_files.add(rel)
                  remote = remote_join(rel)
                  ensure_dir(posixpath.dirname(remote))
                  with open(full, "rb") as fh:
                      ftp.storbinary("STOR " + remote, fh)
                  uploaded += 1
          print("Uploaded %d files to %s" % (uploaded, HOST))

          # 2) Optionally remove remote files that are no longer in dist/.
          if DELETE:
              stale = walk_remote("") - local_files
              for rel in sorted(stale):
                  try:
                      ftp.delete(remote_join(rel))
                      print("Deleted stale:", rel)
                  except ftplib.error_perm as exc:
                      print("::warning::Could not delete %s: %s" % (rel, exc))
          else:
              print("Remote files not present in dist/ were left untouched")

          ftp.quit()
          print("FTPS upload finished")
          PY
          echo "Uploaded dist/ to ${FTP_DIR} over explicit FTPS"
