<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BOZE">
  <!--
    BOZE 网站图标 / Favicon — 纯白底适配版
    ────────────────────────────────────────────────────────────────
    · 圆角正方形深石墨碳黑底盘（#1E2225），无论浏览器标签页主题
      变为白/灰/黑，本图标永远自带深色底盘，保持 100% 识别度
    · 螺栓 B + 螺母 O 以纯白（#FFFFFF）嵌入，螺纹切槽与内六角槽
      保持真透明 → 透出石墨底盘，形成机加工凹槽读感
    · 16px 标签页尺寸下 B 的螺纹简化为 3 道宽槽（渐进式披露）
  -->

  <!-- 深石墨碳黑圆角底盘 -->
  <rect id="favicon-plate" width="64" height="64" rx="14" fill="#1E2225"/>

  <!-- BO 组合标识 -->
  <g id="favicon-bo" transform="translate(2.25, 14.48) scale(0.1752)" fill="#FFFFFF">

    <!-- 字母【B】：螺栓竖杆 + 双受力弧面（3 道简化螺纹槽） -->
    <path id="favicon-B" fill-rule="evenodd" d="
      M 10 0 H 55 V 200 H 10 Z
      M 55 0 C 90 0, 125 15, 125 50 C 125 80, 100 95, 75 95 C 105 95, 130 110, 130 145 C 130 185, 90 200, 55 200 Z
      M 52 30 L 75 30 C 85 30, 95 40, 95 50 C 95 60, 85 70, 75 70 L 52 70 Z
      M 52 125 L 75 125 C 85 125, 98 135, 98 150 C 98 165, 85 175, 75 175 L 52 175 Z
      M 10 30 H 55 V 44 H 10 Z
      M 10 93 H 55 V 107 H 10 Z
      M 10 156 H 55 V 170 H 10 Z
    "/>

    <!-- 字母【O】：外六角螺母，内六角槽真挖空 + 实心定位凸台 -->
    <g id="favicon-O" transform="translate(143, 0)">
      <path fill-rule="evenodd" d="
        M 100 0 L 186.6 50 L 186.6 150 L 100 200 L 13.4 150 L 13.4 50 Z
        M 100 45 L 147.6 72.5 L 147.6 127.5 L 100 155 L 52.4 127.5 L 52.4 72.5 Z
      "/>
      <circle cx="100" cy="100" r="24"/>
    </g>
  </g>
</svg>
